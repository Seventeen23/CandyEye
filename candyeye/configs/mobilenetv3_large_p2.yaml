# CandyEye — training profile "f": MobileNetV3-Large + SPPF/C2PSA + P2 head
#
# Full-depth MobileNetV3-Large backbone (all 16 torchvision feature blocks,
# no truncation) in the YOLO yaml layer table, plus SPPF/C2PSA global context
# and a stride-4 P2 detection level fused after the neck.
#
# MobileNetV3-Large stride plan (reciprocal): 0-1 /2, 2-3 /4, 4-6 /8,
# 7-12 /16, 13-15 /32.  Note features 1-6 use ReLU and 7-15 use Hardswish in
# torchvision, and features[1] is a stride-1 expansion==input block.
#
# Four heads -> strides [4, 8, 16, 32].  See convert_mobilenet.py for the
# layer<->features index map used when loading ImageNet weights.
nc: 20
scale: n
mobilenet_variant: large

backbone:
  - [-1, 1, MobileStem, [16, 3, 2]]                 # 0  /2
  - [-1, 1, MBConv, [16, 3, 1, 16, False, "RE"]]    # 1  /2
  - [-1, 1, MBConv, [24, 3, 2, 64, False, "RE"]]    # 2  /4
  - [-1, 1, MBConv, [24, 3, 1, 72, False, "RE"]]    # 3  /4  P2 source
  - [-1, 1, MBConv, [40, 5, 2, 72, True, "RE"]]     # 4  /8  P3
  - [-1, 1, MBConv, [40, 5, 1, 120, True, "RE"]]    # 5  /8
  - [-1, 1, MBConv, [40, 5, 1, 120, True, "RE"]]    # 6  /8
  - [-1, 1, MBConv, [80, 3, 2, 240, False, "HS"]]   # 7  /16 P4
  - [-1, 1, MBConv, [80, 3, 1, 200, False, "HS"]]   # 8  /16
  - [-1, 1, MBConv, [80, 3, 1, 184, False, "HS"]]   # 9  /16
  - [-1, 1, MBConv, [80, 3, 1, 184, False, "HS"]]   # 10 /16
  - [-1, 1, MBConv, [112, 3, 1, 480, True, "HS"]]   # 11 /16
  - [-1, 1, MBConv, [112, 3, 1, 672, True, "HS"]]   # 12 /16
  - [-1, 1, MBConv, [160, 5, 2, 672, True, "HS"]]   # 13 /32
  - [-1, 1, MBConv, [160, 5, 1, 960, True, "HS"]]   # 14 /32
  - [-1, 1, MBConv, [160, 5, 1, 960, True, "HS"]]   # 15 /32
  - [-1, 1, SPPF, [512, 5]]                         # 16
  - [-1, 1, C2PSA, [512]]                           # 17 /32 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 18
  - [[-1, 7], 1, Concat, [1]]                        # 19 cat backbone P4
  - [-1, 1, C3k2, [512, False]]                      # 20
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 21
  - [[-1, 4], 1, Concat, [1]]                        # 22 cat backbone P3
  - [-1, 1, C3k2, [256, False]]                      # 23 P3/8 (small)
  - [-1, 1, Conv, [256, 3, 2]]                       # 24
  - [[-1, 20], 1, Concat, [1]]                       # 25 cat head P4
  - [-1, 1, C3k2, [512, False]]                      # 26 P4/16 (medium)
  - [-1, 1, Conv, [512, 3, 2]]                       # 27
  - [[-1, 17], 1, Concat, [1]]                       # 28 cat backbone P5
  - [-1, 1, C3k2, [1024, True]]                      # 29 P5/32 (large)
  - [23, 1, nn.Upsample, [None, 2, "nearest"]]       # 30 upsample fused P3 x2
  - [[-1, 3], 1, Concat, [1]]                        # 31 cat backbone P2 (/4)
  - [-1, 1, C3k2, [128, False]]                      # 32 P2/4
  - [[32, 23, 26, 29], 1, Detect, [nc]]              # 33 P2/P3/P4/P5, parallel
