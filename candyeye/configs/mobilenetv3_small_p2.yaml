# CandyEye — training profile "e": MobileNetV3-Small + SPPF/C2PSA + P2 head
#
# Same MobileNetV3-Small backbone as mobilenetv3_small.yaml, but two additions:
#
#   * SPPF + C2PSA are applied to the stride-32 feature (torchvision's raw
#     backbone has no global-context block), mirroring the tail of yolo11.yaml.
#   * A stride-4 (P2) detection level is fused after the neck, exactly like
#     yolo11_p2.yaml (upsample the fused P3 x2, concat the backbone /4 block).
#
# Four heads -> strides [4, 8, 16, 32], channels 32/64/128/256.
# Channels stay explicit (no width_mult) for the MobileNet blocks; the head
# keeps the stock YOLO width scaling.  torchvision feature indices 0..9 map to
# layers 0..10 (layer 4 repeats features.3, see convert_mobilenet.py).
nc: 20
scale: n
mobilenet_variant: small

backbone:
  - [-1, 1, MobileStem, [16, 3, 2]]                 # 0 /2
  - [-1, 1, MBConv, [16, 3, 2, 16, True, "RE"]]     # 1 /4  P2 source
  - [-1, 1, MBConv, [24, 3, 2, 72, False, "RE"]]    # 2 /8
  - [-1, 1, MBConv, [24, 3, 1, 88, False, "RE"]]    # 3 /8
  - [-1, 1, MBConv, [24, 3, 1, 88, False, "RE"]]    # 4 /8  P3
  - [-1, 1, MBConv, [40, 5, 2, 96, True, "HS"]]     # 5 /16
  - [-1, 1, MBConv, [40, 5, 1, 240, True, "HS"]]    # 6 /16 P4
  - [-1, 1, MBConv, [40, 5, 1, 240, True, "HS"]]    # 7 /16
  - [-1, 1, MBConv, [48, 5, 1, 120, True, "HS"]]    # 8 /16
  - [-1, 1, MBConv, [48, 5, 1, 144, True, "HS"]]    # 9 /16
  - [-1, 1, MBConv, [96, 5, 2, 288, True, "HS"]]    # 10 /32
  - [-1, 1, SPPF, [512, 5]]                         # 11
  - [-1, 1, C2PSA, [512]]                           # 12 /32 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14 cat backbone P4
  - [-1, 1, C3k2, [512, False]]                      # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 16
  - [[-1, 4], 1, Concat, [1]]                        # 17 cat backbone P3
  - [-1, 1, C3k2, [256, False]]                      # 18 P3/8 (small)
  - [-1, 1, Conv, [256, 3, 2]]                       # 19
  - [[-1, 15], 1, Concat, [1]]                       # 20 cat head P4
  - [-1, 1, C3k2, [512, False]]                      # 21 P4/16 (medium)
  - [-1, 1, Conv, [512, 3, 2]]                       # 22
  - [[-1, 12], 1, Concat, [1]]                       # 23 cat backbone P5
  - [-1, 1, C3k2, [1024, True]]                      # 24 P5/32 (large)
  - [18, 1, nn.Upsample, [None, 2, "nearest"]]       # 25 upsample fused P3 x2
  - [[-1, 1], 1, Concat, [1]]                        # 26 cat backbone P2 (/4)
  - [-1, 1, C3k2, [128, False]]                      # 27 P2/4
  - [[27, 18, 21, 24], 1, Detect, [nc]]              # 28 P2/P3/P4/P5, parallel
