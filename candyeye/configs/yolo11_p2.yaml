# CandyEye — training profile "a": YOLO11n + P2 small-object head
#
# Same YOLO11n CSP graph as configs/yolo11.yaml with an extra stride-4
# detection level (P2) fused from the top-down P3 feature and the backbone's
# stride-4 block. Four heads -> strides [4, 8, 16, 32], channels 32/64/128/256.
#
# The new P2 layers (23-25) are appended AFTER the original neck and BEFORE the
# Detect head, so official 0..22 indices are unchanged and pretrained yolo11n
# weights load 1:1 (remap_prefix rekeys only the Detect index 23 -> 26).
# Entry format: [from, repeats, module, args] (see configs/yolo11.yaml).

nc: 20
scale: n

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 cat backbone P4
  - [-1, 1, C3k2, [512, False]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 cat backbone P3
  - [-1, 1, C3k2, [256, False]]                   # 16 P3/8 (small)
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18 cat head P4
  - [-1, 1, C3k2, [512, False]]                   # 19 P4/16 (medium)
  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21 cat head P5
  - [-1, 1, C3k2, [1024, True]]                   # 22 P5/32 (large)
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]    # 23 upsample fused P3 x2
  - [[-1, 2], 1, Concat, [1]]                     # 24 cat backbone P2 (64)
  - [-1, 1, C3k2, [128, False]]                   # 25 P2/4 (32 after width)
  - [[25, 16, 19, 22], 1, Detect, [nc]]           # 26 P2/P3/P4/P5, parallel