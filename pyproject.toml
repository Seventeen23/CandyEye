[project]
name = "CandyEye"
version = "0.1.0"
description = "A lightweight, CPU-first object detector with an optional cross-scale exchange neck."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
onnx = ["onnx>=1.16"]
parity = ["onnx>=1.16", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "matplotlib>=3.8", "onnx>=1.16"]

[project.scripts]
candyeye-train = "candyeye.training.trainer:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["candyeye*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
candyeye = ["configs/*.yaml", "assets/*.pth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "onnx: numerical parity against the official ONNX graph (opt-in; see .github/workflows/onnx-parity.yml)",
]
