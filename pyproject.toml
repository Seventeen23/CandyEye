[project]
name = "CandyEye"
dynamic = ["version"]
description = "A lightweight, CPU-first object detector with an optional cross-scale exchange neck."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Seventeen23" }]
keywords = ["object-detection", "computer-vision", "yolo", "cpu", "edge-ai", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
onnx = ["onnx>=1.16"]
parity = ["onnx>=1.16", "onnxruntime>=1.17"]
weights = ["ultralytics>=8.3"]
dev = ["pytest>=7.4", "matplotlib>=3.8", "onnx>=1.16"]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Seventeen23/CandyEye"
Repository = "https://github.com/Seventeen23/CandyEye"
Issues = "https://github.com/Seventeen23/CandyEye/issues"
Changelog = "https://github.com/Seventeen23/CandyEye/blob/master/CHANGELOG.md"

[project.scripts]
candyeye-train = "candyeye.training.trainer:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "candyeye.__version__" }

[tool.setuptools.packages.find]
include = ["candyeye*"]
namespaces = false

[tool.setuptools]
include-package-data = true

# Only the architecture configs ship in the distribution. The clean `yolo11n`
# weights are NOT packaged (AGPL provenance); `candyeye.paths` downloads them on
# demand. The repo still tracks candyeye/assets/yolo11n.pth for offline dev/tests.
[tool.setuptools.package-data]
candyeye = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "onnx: numerical parity against the official ONNX graph (opt-in; see .github/workflows/onnx-parity.yml)",
]
