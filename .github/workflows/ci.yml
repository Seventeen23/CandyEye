# Main CI: install CPU-only PyTorch, install the package, run the test suite.
# ONNX numerical-parity tests are marked `onnx` and run in the separate
# `onnx-parity.yml` workflow (they need the official exported ONNX graph).
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install CandyEye with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q -m "not onnx"
