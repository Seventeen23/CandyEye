# Publish CandyEye to TestPyPI / PyPI.
#
# - Tag push `v*`                -> TestPyPI dry-run, then PyPI.
# - Manual `workflow_dispatch`   -> publish to the selected index.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secret required.
# One-time setup (web UI):
#   PyPI / TestPyPI -> Account -> Publishing -> add a trusted publisher with
#     owner: Seventeen23   repo: CandyEye   workflow: publish.yml
#     environments: pypi and testpypi
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Check the weights are not packaged
        run: |
          if unzip -l dist/*.whl | grep -q '\.pth'; then
            echo "::error::wheel unexpectedly contains a .pth"; exit 1
          fi
          if tar tzf dist/*.tar.gz | grep -q '\.pth'; then
            echo "::error::sdist unexpectedly contains a .pth"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---- Tag push: dry-run on TestPyPI, then publish to PyPI -----------------
  testpypi-tag:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-tag:
    if: github.event_name == 'push'
    needs: [build, testpypi-tag]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---- Manual dispatch: publish to the chosen index ------------------------
  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
